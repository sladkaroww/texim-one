<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="nav.convoy">Convoy</title>
    <meta name="description" content="TEXIM ONE convoy calendar and invite requests.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="https://i.ibb.co/21RJ4r30/TEXIM-ONE-TRUE-CUT.png" type="image/png">
</head>
<body>
    <div class="preloader">
        <div class="spinner"></div>
    </div>

    <header class="header">
        <div class="container header-container">
            <a href="/" class="logo"><img src="https://files.catbox.moe/07u3sd.png" alt="TEXIM ONE" class="logo-img"></a>
            <nav class="nav">
                <ul class="nav-list">
                    <li><a href="/" class="nav-link" data-i18n="nav.home">Home</a></li>
                    <li><a href="/convoy.html" class="nav-link active" data-i18n="nav.convoy">Convoy</a></li>
                    <li><a href="/media.html" class="nav-link" data-i18n="nav.media">Media</a></li>
                </ul>
            </nav>
            <select id="langSwitcher" class="lang-switcher" aria-label="Language">
                <option value="en">EN</option>
                <option value="bg">BG</option>
            </select>
        </div>
    </header>

    <section class="hero hero--inner">
        <div class="hero-bg" style="background-image:url('https://files.catbox.moe/g9j45t.jpg');"></div>
        <div class="hero-overlay"></div>
        <div class="container">
            <div class="hero-content">
                <h1 class="hero-title" data-i18n="nav.convoy">Convoy</h1>
                <p class="hero-subtitle" data-i18n="convoy.sub">Here are all convoys we are invited to.</p>
            </div>
        </div>
    </section>

    <section class="section section--light" id="invite">
        <div class="container section--narrow">
            <div class="invite-head">
                <h2 class="section-title" data-i18n="convoy.inviteTitle">Invite Us to a convoy</h2>
                <p class="section-subtitle" data-i18n="convoy.inviteSub">Fill out the form below and we will send your invite to our Discord channel.</p>
            </div>
            <form id="inviteForm" class="invite-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="eventName" data-i18n="contact.eventName">Event Name *</label>
                        <input type="text" id="eventName" name="eventName" required>
                    </div>
                    <div class="form-group">
                        <label for="eventDate" data-i18n="contact.eventDate">Event Date *</label>
                        <input type="date" id="eventDate" name="eventDate" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="eventTime" data-i18n="contact.eventTime">Event Time</label>
                        <input type="time" id="eventTime" name="eventTime">
                    </div>
                    <div class="form-group">
                        <label for="discord" data-i18n="contact.discord">Your Discord *</label>
                        <input type="text" id="discord" name="discord" placeholder="name#0000 or @user" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="eventLink" data-i18n="contact.eventLink">Event Link</label>
                    <input type="url" id="eventLink" name="eventLink" placeholder="https://...">
                </div>
                <div class="form-group">
                    <label for="email" data-i18n="contact.email">Email</label>
                    <input type="email" id="email" name="email">
                </div>
                <div class="form-group">
                    <label for="details" data-i18n="contact.details">Additional Details</label>
                    <textarea id="details" name="details" rows="4"></textarea>
                </div>
                <button type="submit" class="btn btn-primary" data-i18n="contact.submit">Send Invite</button>
                <div id="formMessage" class="form-message"></div>
            </form>
        </div>
    </section>

    <section class="section">
        <div class="container">
            <div class="section-head">
                <h2 class="section-title" data-i18n="convoy.calendar.title">Convoy Calendar</h2>
            </div>
            <div id="calendar" class="calendar-grid">
                <div class="calendar-loading" data-i18n="convoy.calendar.loading">Loading convoys...</div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="social-links footer-social">
                <a href="https://discord.com/invite/2sSKVKXUtn" class="social-link" title="Discord"><img src="/img/icons/DISCORD.png" alt="Discord"></a>
                <a href="https://steamcommunity.com/groups/tex1m" class="social-link" title="Steam"><img src="/img/icons/STEAM.png" alt="Steam"></a>
                <a href="https://www.instagram.com/texim.one" class="social-link" title="Instagram"><img src="/img/icons/INSTAGRAM.png" alt="Instagram"></a>
                <a href="https://www.twitch.tv/team/tex1m" class="social-link" title="Twitch"><img src="/img/icons/TWITCH.png" alt="Twitch"></a>
                <a href="https://truckersmp.com/vtc/74050" class="social-link" title="TruckersMP"><img src="/img/icons/TRUCKERSMP.png" alt="TruckersMP"></a>
                <a href="https://trucksbook.eu/company/218511" class="social-link" title="TrucksBook"><img src="/img/icons/TRUCKSBOOK.png" alt="TrucksBook"></a>
            </div>
        </div>
    </footer>

    <script src="/js/i18n.js"></script>
    <script src="/js/convoy.js"></script>
    <script src="/js/form.js"></script>
    <script src="/js/main.js"></script>
</body>
</html>
