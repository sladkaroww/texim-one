<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Media – Texim</title>

  <!-- If you have existing CSS, keep those links and adjust/remove duplicates as needed -->
  <style>
    :root {
      --bg: #0b0b0f;
      --card-bg: #15151a;
      --text: #e5e5e5;
      --muted: #9aa0a6;
      --accent: #4f8cff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 24px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    h1, h2 {
      margin-bottom: 16px;
    }

    h1 {
      font-size: 2rem;
      margin-top: 8px;
    }

    h2 {
      font-size: 1.4rem;
      margin-top: 24px;
      margin-bottom: 12px;
    }

    #news-container {
      display: grid;
      gap: 16px;
    }

    .news-item {
      background: var(--card-bg);
      border: 1px solid #22222a;
      border-radius: 10px;
      padding: 16px;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .news-item:hover {
      transform: translateY(-2px);
      border-color: #2f2f3a;
    }

    .news-date {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .news-title {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .news-title a {
      color: var(--text);
      text-decoration: none;
      border-bottom: 1px dashed var(--accent);
    }

    .news-title a:hover {
      border-bottom-style: solid;
    }

    .news-description {
      font-size: 0.92rem;
      color: #cfcfcf;
    }

    footer {
      margin-top: 40px;
      font-size: 0.85rem;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Media</h1>

    <section id="news-section">
      <h2>News</h2>
      <div id="news-container">
        <!-- News items will be inserted here by news.js -->
      </div>
    </section>

    <!-- You can add more sections below (videos, screenshots, etc.) if you want -->

    <footer>
      © <span id="year"></span> VTC Texim / ВТК Тексим
    </footer>
  </div>

  <script>
    // Set current year in footer
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>

  <script src="news.js"></script>
</body>
</html>
